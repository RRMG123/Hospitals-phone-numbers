<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Riverside Room Lookup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root {
    --bg: #F3F6F8;
    --surface: #FFFFFF;
    --surface-2: #E9EEF2;
    --ink: #121820;
    --ink-muted: #5C6770;
    --border: #DBE3E8;
    --accent: #0D6FA6;
    --accent-ink: #FFFFFF;
    --accent-wash: #E4F1F8;
    --warn: #8A5D00;
    --warn-edge: #D89A2A;
    --warn-bg: #FBF1DD;
    --focus: #0D6FA6;
    --shadow: 0 1px 2px rgba(18, 24, 32, 0.06), 0 4px 14px rgba(18, 24, 32, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0A0E13;
      --surface: #121820;
      --surface-2: #1A2129;
      --ink: #EDF1F4;
      --ink-muted: #8E9BA6;
      --border: #232C35;
      --accent: #59B0EA;
      --accent-ink: #06131C;
      --accent-wash: #16232C;
      --warn: #E7B04C;
      --warn-edge: #8A6A22;
      --warn-bg: #201A0C;
      --focus: #59B0EA;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 20px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0A0E13;
    --surface: #121820;
    --surface-2: #1A2129;
    --ink: #EDF1F4;
    --ink-muted: #8E9BA6;
    --border: #232C35;
    --accent: #59B0EA;
    --accent-ink: #06131C;
    --accent-wash: #16232C;
    --warn: #E7B04C;
    --warn-edge: #8A6A22;
    --warn-bg: #201A0C;
    --focus: #59B0EA;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 20px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 460px;
    margin: 0 auto;
    padding: 0 18px 40px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    padding-top: 28px;
    padding-bottom: 14px;
  }
  .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 6px;
  }
  h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
    text-wrap: balance;
  }
  .lede {
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink-muted);
    margin: 0 0 18px;
    max-width: 42ch;
  }

  .search-field {
    position: relative;
  }
  .search-field svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-muted);
    pointer-events: none;
  }
  #search {
    width: 100%;
    font-family: "IBM Plex Mono", monospace;
    font-size: 18px;
    font-variant-numeric: tabular-nums;
    padding: 13px 16px 13px 42px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease;
  }
  #search::placeholder { color: var(--ink-muted); font-family: "IBM Plex Sans", sans-serif; font-weight: 400; }
  #search:focus { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 20%, transparent); }

  .status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 2px 10px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  .status-row .count { font-family: "IBM Plex Mono", monospace; }

  main { flex: 1; }

  .results {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: stretch;
    overflow: hidden;
  }
  .row.flagged { border-left: 3px solid var(--warn-edge); }

  .row-body {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
  }
  .row-flag {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--warn);
    background: var(--warn-bg);
    display: inline-block;
    padding: 2px 7px;
    border-radius: 5px;
    width: fit-content;
    margin-bottom: 2px;
  }
  .row-title {
    font-size: 15.5px;
    font-weight: 600;
    line-height: 1.25;
  }
  .row-range {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-muted);
    line-height: 1.4;
  }
  .row-note {
    font-size: 11.5px;
    color: var(--warn);
    line-height: 1.4;
  }

  .call {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 16px;
    background: var(--accent-wash);
    color: var(--accent);
    text-decoration: none;
    border-left: 1px solid var(--border);
    font-family: "IBM Plex Mono", monospace;
    font-size: 13.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    transition: background 0.12s ease;
  }
  .call:hover, .call:active { background: var(--accent); color: var(--accent-ink); }
  .call svg { flex-shrink: 0; }

  .empty {
    text-align: center;
    padding: 48px 20px;
    color: var(--ink-muted);
    font-size: 14px;
  }

  footer {
    margin-top: 22px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--ink-muted);
  }
  footer strong { color: var(--ink); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <p class="eyebrow">Riverside Community Hospital</p>
    <h1>Room → extension lookup</h1>
    <p class="lede">Enter a room number to find the unit line, or search by unit name.</p>
    <div class="search-field">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <label for="search" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Room number or unit name</label>
      <input id="search" type="text" inputmode="numeric" placeholder="Room number or unit…" autocomplete="off" autofocus />
    </div>
    <div class="status-row">
      <span id="status-label">All units</span>
      <span class="count" id="status-count">14</span>
    </div>
  </header>

  <main>
    <div class="results" id="results"></div>
  </main>

  <footer>
    <strong>D2 / D2 Med Surg</strong> both list rooms 201&ndash;226 in the source list &mdash; flagged pending confirmation from Radiology QI.<br>
    Source: RCH Contact List, Radiology QI project.
  </footer>
</div>

<script>
  const DIRECTORY = [
    { section: "G6",                      range: "6201–6235 and G6 (1–33)",   number: "951-495-6000", ranges: [[6201,6235]] },
    { section: "G5",                      range: "5201–5235",                        number: "951-495-5000", ranges: [[5201,5235]] },
    { section: "Vintage 6",               range: "650–660, 670–677",             number: "951-788-3226", ranges: [[650,660],[670,677]] },
    { section: "South 5",                 range: "550–566",                           number: "951-788-3283", ranges: [[550,566]] },
    { section: "North 5",                 range: "570–586",                           number: "951-788-3144", ranges: [[570,586]] },
    { section: "South/East 3",            range: "350–366, 370–384",             number: "951-788-3276", ranges: [[350,366],[370,384]] },
    { section: "D3 Med Surg",             range: "301–326",                           number: "951-788-3278", ranges: [[301,326]] },
    { section: "D2",                      range: "201–226",                           number: "951-788-3692", ranges: [[201,226]], flagged: true },
    { section: "D2 Med Surg",             range: "201–226, 250–266",             number: "951-788-3480", ranges: [[201,226],[250,266]], flagged: true },
    { section: "ICU — Medical & Neuro", range: "4201–4235",                       number: "951-495-4000", ranges: [[4201,4235]] },
    { section: "G1",                      range: "1201–1224",                         number: "951-495-5106", ranges: [[1201,1224]], note: "ED5, beds 80a–91a — A beds only, volatile" },
    { section: "IMC",                     range: "450–486",                           number: "951-512-4011", ranges: [[450,486]] },
    { section: "SICU",                    range: "401–439",                           number: "951-512-5443", ranges: [[401,439]] },
    { section: "ED",                      range: "Emergency Department",                   number: "951-788-3200", ranges: [], isDept: true },
  ];

  const PHONE_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';

  const searchEl = document.getElementById('search');
  const resultsEl = document.getElementById('results');
  const statusLabel = document.getElementById('status-label');
  const statusCount = document.getElementById('status-count');

  function matches(entry, query) {
    if (!query) return true;
    const q = query.trim().toLowerCase();
    if (entry.section.toLowerCase().includes(q)) return true;
    const num = parseInt(q, 10);
    if (!Number.isNaN(num) && String(num) === q) {
      return entry.ranges.some(([lo, hi]) => num >= lo && num <= hi);
    }
    return false;
  }

  function render() {
    const query = searchEl.value;
    const list = DIRECTORY.filter(e => matches(e, query));

    statusLabel.textContent = query ? `Matching “${query}”` : 'All units';
    statusCount.textContent = list.length;

    if (list.length === 0) {
      resultsEl.innerHTML = '<div class="empty">No unit matches that room number.<br>Call the main line, or check with House Supervisor.</div>';
      return;
    }

    resultsEl.innerHTML = list.map(e => `
      <div class="row ${e.flagged ? 'flagged' : ''}">
        <div class="row-body">
          ${e.flagged ? '<span class="row-flag">Needs verification</span>' : ''}
          <div class="row-title">${e.section}</div>
          <div class="row-range">${e.isDept ? 'Department line' : 'Rooms ' + e.range}</div>
          ${e.note ? `<div class="row-note">${e.note}</div>` : ''}
        </div>
        <a class="call" href="tel:${e.number.replace(/\D/g, '')}">
          ${PHONE_ICON}${e.number}
        </a>
      </div>
    `).join('');
  }

  searchEl.addEventListener('input', render);
  render();
</script>
</body>
</html>
